<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumbo Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Jumbo Planner</h1>
    <p>Leidinggevende Dashboard</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="planning">📅 Planning</button>
    <button class="tab" data-tab="aanvragen">📝 Shift Aanvragen <span class="badge">3</span></button>
    <button class="tab" data-tab="berichten">💬 Berichten</button>
    <button class="tab" data-tab="kalender">🗓️ Kalender</button>
  </nav>

  <main class="card">

    <!-- Planning -->
    <section id="planning" class="tabview active">
      <div class="card-header">
        <h2 id="planningDate"></h2>
        <span>👥 5 studenten ingepland</span>
      </div>
      <div id="planningList"></div>
    </section>

    <!-- Aanvragen -->
    <section id="aanvragen" class="tabview">
      <h2>Shift aanvragen</h2>
      <div id="requestList"></div>
    </section>

    <!-- Berichten -->
    <section id="berichten" class="tabview">
      <div class="chat-container">
        <div class="chat-header">
          <select id="studentSelect">
            <option value="">Selecteer een student om te chatten</option>
          </select>
        </div>
        <div id="chatMessages" class="chat-messages">
          <div class="chat-placeholder">
            Welkom bij Berichten<br>
            <small>Selecteer een student om een gesprek te starten</small>
          </div>
        </div>
        <div class="chat-input">
          <input id="messageInput" type="text" placeholder="Typ een bericht…">
          <button id="sendMessage">➤</button>
        </div>
      </div>
    </section>

    <!-- Kalender (uit fill_Beschikbaarheid) -->
    <section id="kalender" class="tabview">
      <div style="display:flex; gap:1rem; align-items:flex-start; flex-wrap:wrap;">
        <div id="inhoud_container" style="flex:1; min-width:280px;"></div>
        <div id="tijd_container" style="flex:1; min-width:260px;"></div>
      </div>
    </section>

  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    // ── KALENDER (uit fill_Beschikbaarheid) ──────────────────────────
    const inhoud_container = document.getElementById('inhoud_container')
    const tijd_container   = document.getElementById('tijd_container')

    const maanden = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"]
    let geselcteerde_dagen = []
    const kalenderDatum = new Date()
    let thisYear  = kalenderDatum.getFullYear()
    let thisMonth = kalenderDatum.getMonth()
    let is_flex   = true

    const getDaysInMonth = (month, year) => {
      const days = [], date = new Date(year, month, 1)
      while (date.getMonth() === month) { days.push(new Date(date)); date.setDate(date.getDate()+1) }
      return days
    }

    const kiesTijd = (day) => {
      tijd_container.innerHTML = ""
      const card = document.createElement("div"); card.className = "time-card"

      const title = document.createElement("h3"); title.textContent = "Beschikbaarheid instellen"

      const datumLabel = document.createElement("p"); datumLabel.className = "time-date"
      datumLabel.textContent = day.toLocaleDateString("nl-BE", { weekday:"long", day:"numeric", month:"long" })

      const flexBtn = document.createElement("button"); flexBtn.textContent = "Flexibel"; flexBtn.className = "flex-btn"
      flexBtn.style.background = "#FDC100"
      flexBtn.onclick = () => {
        is_flex = !is_flex
        flexBtn.style.background = is_flex ? "#FDC100" : "#F4F4F4"
      }

      const row = document.createElement("div"); row.className = "time-row"
      const startSelect = document.createElement("select")
      const eindeSelect = document.createElement("select")
      for (let i = 6; i <= 21; i++) {
        const o1 = document.createElement("option"); o1.value = i; o1.textContent = i+":00"; startSelect.appendChild(o1)
        const o2 = document.createElement("option"); o2.value = i; o2.textContent = i+":00"; eindeSelect.appendChild(o2)
      }
      row.append(startSelect, eindeSelect)

      const opslaanBtn = document.createElement("button"); opslaanBtn.textContent = "Opslaan"; opslaanBtn.className = "primary-btn"
      const closeBtn   = document.createElement("button")

      opslaanBtn.onclick = () => {
        const volledige_start = new Date(day)
        const volledige_einde = new Date(day)
        if (is_flex) {
          volledige_start.setHours(6,0,0,0); volledige_einde.setHours(21,0,0,0)
        } else {
          volledige_start.setHours(startSelect.value,0,0,0); volledige_einde.setHours(eindeSelect.value,0,0,0)
        }
        const alBestaand = geselcteerde_dagen.some(d => d.start.toDateString() === volledige_start.toDateString())
        if (!alBestaand) geselcteerde_dagen.push({ start: volledige_start, eind: volledige_einde })
        post_datums()
        closeBtn.textContent = "Sluiten"; closeBtn.className = "secondary-btn"
        closeBtn.onclick = () => { tijd_container.innerHTML = "" }
      }

      card.append(title, datumLabel, flexBtn, row, opslaanBtn, closeBtn)
      tijd_container.appendChild(card)
    }

    const post_datums = () => {
      const bestaand = tijd_container.querySelector('.verstuur-card')
      if (bestaand) bestaand.remove()

      const card = document.createElement("div"); card.className = "time-card verstuur-card"
      const title = document.createElement("h3"); title.textContent = "Verstuur beschikbaarheid"

      const lijst = document.createElement("ul"); lijst.style.padding = "0 0 8px 1rem"
      geselcteerde_dagen.forEach(d => {
        const li = document.createElement("li")
        li.textContent = d.start.toLocaleDateString("nl-BE", { weekday:"short", day:"numeric", month:"short" })
          + " – " + d.start.getHours() + ":00 tot " + d.eind.getHours() + ":00"
        lijst.appendChild(li)
      })

      const btn = document.createElement("button"); btn.className = "primary-btn"; btn.textContent = "Verstuur beschikbaarheid"
      btn.addEventListener("click", () => {
        fetch('/beschikbaarheid_opslaan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gekozen_shifts: geselcteerde_dagen })
        }).then(() => alert("Shifts verstuurd!"))
      })

      card.append(title, lijst, btn)
      tijd_container.append(card)
    }

    const fill_Beschikbaarheid = () => {
      inhoud_container.innerHTML = ""
      tijd_container.innerHTML  = ""

      const card   = document.createElement("div"); card.className = "card"
      const header = document.createElement("div")
      header.style.cssText = "display:flex;justify-content:space-between;align-items:center"

      const btnBack    = document.createElement("button"); btnBack.textContent    = "<"
      const btnForward = document.createElement("button"); btnForward.textContent = ">"
      const title      = document.createElement("h2");    title.textContent = maanden[thisMonth] + " " + thisYear

      btnBack.onclick = () => {
        kalenderDatum.setMonth(kalenderDatum.getMonth()-1)
        thisMonth = kalenderDatum.getMonth(); thisYear = kalenderDatum.getFullYear()
        fill_Beschikbaarheid()
      }
      btnForward.onclick = () => {
        kalenderDatum.setMonth(kalenderDatum.getMonth()+1)
        thisMonth = kalenderDatum.getMonth(); thisYear = kalenderDatum.getFullYear()
        fill_Beschikbaarheid()
      }
      header.append(btnBack, title, btnForward)

      const weekRow = document.createElement("div"); weekRow.className = "calendar-grid header"
      ;["Ma","Di","Wo","Do","Vr","Za","Zo"].forEach(d => {
        const el = document.createElement("div"); el.textContent = d; weekRow.appendChild(el)
      })

      const grid = document.createElement("div"); grid.className = "calendar-grid"
      const firstDay = new Date(thisYear, thisMonth, 1).getDay()
      const offset   = firstDay === 0 ? 6 : firstDay - 1
      for (let i = 0; i < offset; i++) grid.appendChild(document.createElement("div"))

      const today = new Date(); today.setHours(0,0,0,0)
      getDaysInMonth(thisMonth, thisYear).forEach(dag => {
        const cell = document.createElement("div"); cell.className = "day-cell"
        const num  = document.createElement("div"); num.className = "day-number"; num.textContent = dag.getDate()
        dag.setHours(0,0,0,0)
        if (dag < today) cell.style.backgroundColor = "lightgray"

        const opgeslagen = geselcteerde_dagen.some(d => d.start.toDateString() === dag.toDateString())
        if (opgeslagen) cell.style.outline = "2px solid #FDC100"

        cell.appendChild(num)
        cell.addEventListener("click", () => {
          if (dag < today) return
          kiesTijd(dag)
          document.querySelectorAll(".day-cell").forEach(c => c.classList.remove("active"))
          cell.classList.add("active")
        })
        grid.appendChild(cell)
      })

      card.append(header, weekRow, grid)
      inhoud_container.appendChild(card)
    }

    // Kalender laden als de tab actief wordt
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if (tab.dataset.tab === 'kalender') fill_Beschikbaarheid()
      })
    })

    // Bij direct laden als kalender-tab actief is
    if (document.getElementById('kalender').classList.contains('active')) fill_Beschikbaarheid()
  </script>

</body>
</html>
